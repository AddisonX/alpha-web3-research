server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name alpha.example.com;

    root /var/www/alpha-dashboard;
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alpha.example.com;

    ssl_certificate /etc/letsencrypt/live/alpha.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/alpha-dashboard-access.conf;

    root /var/www/alpha-dashboard;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=alpha_dashboard_per_ip burst=40 nodelay;
        limit_req zone=alpha_dashboard_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_read_timeout 15s;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ /index.html;
    }
}
