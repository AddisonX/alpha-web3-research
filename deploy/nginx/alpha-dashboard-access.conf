auth_basic "Alpha Strategy Monitor";
auth_basic_user_file /etc/nginx/auth/alpha-dashboard.htpasswd;
server_tokens off;

limit_req zone=alpha_dashboard_per_ip burst=40 nodelay;
limit_req_status 429;
limit_conn alpha_dashboard_conn 20;
limit_conn_status 429;

client_max_body_size 16k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 30s;
