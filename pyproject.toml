[project]
name = "alpha-web3-research"
version = "0.1.0"
description = "Tokyo LightGBM long-only signal, Freqtrade dry-run and monitoring runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.64",
    "fastapi>=0.116.0",
    "lightgbm>=4.6.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "uvicorn>=0.35.0",
    "xgboost==3.4.1",
]

[project.scripts]
alpha-web3-research = "src.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]
freqtrade = [
    "freqtrade==2026.6",
]
